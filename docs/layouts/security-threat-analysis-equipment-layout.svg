<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Threat Analysis Room equipment layout guide</title>
  <desc id="desc">A top-down illustrated guide for placing firewall, IDS/IPS sensors, and zero trust gateway equipment in a rectangular threat analysis room.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#11d8e8"/>
    </marker>
    <marker id="arrowYellow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#ffd84a"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#001326" flood-opacity=".35"/>
    </filter>
    <linearGradient id="floor" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d8dee2"/>
      <stop offset="1" stop-color="#bfc9cf"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f1f5f6"/>
      <stop offset=".18" stop-color="#e1e8eb"/>
      <stop offset=".19" stop-color="#182732"/>
      <stop offset="1" stop-color="#263946"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="980" fill="#071827"/>
  <text x="80" y="78" fill="#f6fbff" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="42" font-weight="800">Threat Analysis Room 配置イメージ</text>
  <text x="82" y="126" fill="#a9c2d4" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="24">外部通信の入口から社内側へ、処理順に設備を並べる</text>

  <g transform="translate(120 175)" filter="url(#softShadow)">
    <rect x="0" y="0" width="1360" height="690" rx="0" fill="url(#floor)" stroke="#e9f2f5" stroke-width="18"/>
    <path d="M0 0 H1360 V690 H0 Z" fill="none" stroke="#4b565d" stroke-width="6"/>
    <path d="M0 206 H1360 M0 344 H1360 M0 482 H1360 M272 0 V690 M544 0 V690 M816 0 V690 M1088 0 V690" stroke="#9daab1" stroke-width="2" opacity=".35"/>

    <rect x="18" y="18" width="1324" height="66" fill="#98a7ae" opacity=".9"/>
    <text x="62" y="60" fill="#28343b" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="23" font-weight="800">奥側の壁</text>

    <rect x="18" y="606" width="1324" height="66" fill="#8e9ca3" opacity=".95"/>
    <text x="1040" y="648" fill="#25313a" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="23" font-weight="800">通路・出入口側</text>

    <rect x="28" y="210" width="18" height="190" fill="#5b666c"/>
    <text x="66" y="312" fill="#2c3941" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="22" font-weight="800">外部回線</text>

    <path d="M92 305 H255" stroke="#11d8e8" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M430 305 H590" stroke="#11d8e8" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M770 305 H930" stroke="#11d8e8" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M1110 305 H1256" stroke="#11d8e8" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(260 245)">
      <rect x="0" y="0" width="170" height="120" rx="8" fill="url(#rack)" stroke="#172733" stroke-width="5"/>
      <rect x="15" y="20" width="140" height="16" rx="3" fill="#111d25"/>
      <rect x="15" y="48" width="140" height="16" rx="3" fill="#111d25"/>
      <rect x="15" y="76" width="140" height="16" rx="3" fill="#111d25"/>
      <circle cx="138" cy="28" r="5" fill="#83ec8f"/>
      <circle cx="138" cy="56" r="5" fill="#ffd84a"/>
      <circle cx="138" cy="84" r="5" fill="#83ec8f"/>
      <text x="85" y="-28" text-anchor="middle" fill="#0d2530" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="28" font-weight="900">Firewall</text>
      <text x="85" y="156" text-anchor="middle" fill="#42505a" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="19" font-weight="700">入口で遮断</text>
    </g>

    <g transform="translate(600 235)">
      <rect x="0" y="0" width="170" height="140" rx="8" fill="url(#rack)" stroke="#172733" stroke-width="5"/>
      <rect x="15" y="22" width="140" height="18" rx="3" fill="#111d25"/>
      <rect x="15" y="54" width="140" height="18" rx="3" fill="#111d25"/>
      <rect x="15" y="86" width="140" height="18" rx="3" fill="#111d25"/>
      <path d="M34 119 H136" stroke="#ffcf44" stroke-width="8" stroke-linecap="round"/>
      <text x="85" y="-28" text-anchor="middle" fill="#0d2530" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="28" font-weight="900">IDS / IPS</text>
      <text x="85" y="176" text-anchor="middle" fill="#42505a" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="19" font-weight="700">検知・防御</text>
    </g>

    <g transform="translate(940 245)">
      <rect x="0" y="0" width="170" height="120" rx="8" fill="#eef4f6" stroke="#172733" stroke-width="5"/>
      <rect x="18" y="18" width="134" height="48" rx="5" fill="#203440"/>
      <path d="M34 85 H136" stroke="#11d8e8" stroke-width="9" stroke-linecap="round"/>
      <circle cx="52" cy="42" r="8" fill="#83ec8f"/>
      <circle cx="85" cy="42" r="8" fill="#83ec8f"/>
      <circle cx="118" cy="42" r="8" fill="#ff6570"/>
      <text x="85" y="-28" text-anchor="middle" fill="#0d2530" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="28" font-weight="900">Zero Trust</text>
      <text x="85" y="156" text-anchor="middle" fill="#42505a" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="19" font-weight="700">認証して通す</text>
    </g>

    <g transform="translate(1255 228)">
      <rect x="0" y="0" width="82" height="154" rx="4" fill="#243541"/>
      <rect x="12" y="18" width="58" height="22" rx="3" fill="#7fdff0"/>
      <rect x="12" y="55" width="58" height="16" rx="2" fill="#111e26"/>
      <rect x="12" y="82" width="58" height="16" rx="2" fill="#111e26"/>
      <rect x="12" y="109" width="58" height="16" rx="2" fill="#111e26"/>
      <text x="41" y="190" text-anchor="middle" fill="#42505a" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="19" font-weight="700">社内側</text>
    </g>

    <g transform="translate(510 475)">
      <rect x="0" y="0" width="335" height="72" rx="8" fill="#203847" stroke="#11d8e8" stroke-width="3"/>
      <text x="168" y="31" text-anchor="middle" fill="#dffaff" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="20" font-weight="900">分析担当者の作業机</text>
      <text x="168" y="58" text-anchor="middle" fill="#a9c2d4" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="17">設備の正面を机側へ向ける</text>
      <path d="M168 0 V-82" stroke="#ffd84a" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowYellow)"/>
    </g>
  </g>

  <g transform="translate(120 900)">
    <rect x="0" y="-42" width="1360" height="58" rx="8" fill="#09253a" stroke="#17455f"/>
    <text x="32" y="-6" fill="#e9f7ff" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="22" font-weight="800">Blenderで置く時の目安：</text>
    <text x="292" y="-6" fill="#b9d2df" font-family="'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="22">3台を一直線ではなく少しずらす。設備同士の間隔を1.5〜2台分空ける。前面パネルは作業机側へ向ける。</text>
  </g>
</svg>
