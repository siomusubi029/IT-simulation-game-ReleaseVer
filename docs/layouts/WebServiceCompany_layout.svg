<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b2234"/>
      <stop offset="1" stop-color="#071723"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#213054"/>
      <stop offset="1" stop-color="#11243a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <style>
      .title { font: 800 36px "Yu Gothic", Meiryo, sans-serif; fill: #eaf6ff; letter-spacing: 1px; }
      .sub { font: 700 18px "Yu Gothic", Meiryo, sans-serif; fill: #b56aff; letter-spacing: 2px; }
      .room { font: 800 25px "Yu Gothic", Meiryo, sans-serif; fill: #eaf6ff; }
      .small { font: 700 15px "Yu Gothic", Meiryo, sans-serif; fill: #aeb8d1; }
      .equip { font: 800 17px "Yu Gothic", Meiryo, sans-serif; fill: #f5f1ff; }
      .root { font: 800 14px Consolas, monospace; fill: #dccaff; }
      .outer { fill: #7f8796; stroke: #e7e2ff; stroke-width: 3; }
      .room-fill { fill: url(#floor); stroke: #8f78cf; stroke-width: 3; }
      .wall { fill: #7f8796; stroke: #e7e2ff; stroke-width: 3; }
      .device { fill: #201d3a; stroke: #b56aff; stroke-width: 3; }
      .server { fill: #27375d; stroke: #88b7ff; stroke-width: 3; }
      .screen { fill: #05131d; stroke: #64eaf4; stroke-width: 3; }
      .cyan { fill: #64eaf4; }
      .purple { fill: #b56aff; }
      .yellow { fill: #ffd35a; }
      .lime { fill: #8ee87a; }
      .path { fill: none; stroke: #b56aff; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 10 12; opacity: .75; }
    </style>
  </defs>
  <rect width="1600" height="950" fill="url(#bg)"/>
  <text x="90" y="70" class="sub">STARTUP MODE / WEB SERVICE</text>
  <text x="90" y="116" class="title">Webサービス運営会社 配置イメージ図</text>
  <text x="90" y="148" class="small">クラウド基盤、DevOps、データベース、開発・外部連携に分けてSRE/運用の流れを表現。</text>

  <g filter="url(#shadow)">
    <rect x="90" y="190" width="1420" height="650" rx="14" class="outer"/>
    <rect x="130" y="230" width="1340" height="570" rx="8" class="room-fill"/>
    <rect x="130" y="230" width="670" height="285" class="room-fill"/>
    <rect x="800" y="230" width="670" height="285" class="room-fill"/>
    <rect x="130" y="515" width="670" height="285" class="room-fill"/>
    <rect x="800" y="515" width="670" height="285" class="room-fill"/>
    <rect x="775" y="230" width="50" height="210" class="wall"/>
    <rect x="775" y="590" width="50" height="210" class="wall"/>
    <rect x="130" y="490" width="575" height="50" class="wall"/>
    <rect x="895" y="490" width="575" height="50" class="wall"/>
    <rect x="705" y="490" width="190" height="50" fill="rgba(181,106,255,.14)" stroke="#b56aff" stroke-width="3" stroke-dasharray="10 10"/>
    <rect x="775" y="440" width="50" height="150" fill="rgba(181,106,255,.14)" stroke="#b56aff" stroke-width="3" stroke-dasharray="10 10"/>

    <text x="465" y="270" text-anchor="middle" class="room">クラウド基盤ルーム</text>
    <text x="1135" y="270" text-anchor="middle" class="room">DevOpsルーム</text>
    <text x="465" y="555" text-anchor="middle" class="room">データベース / 配信ルーム</text>
    <text x="1135" y="555" text-anchor="middle" class="room">開発・外部連携ルーム</text>

    <g transform="translate(215 335)"><rect width="120" height="130" rx="8" class="server"/><rect x="22" y="25" width="76" height="14" rx="3" fill="#0b1d29"/><rect x="22" y="55" width="76" height="14" rx="3" fill="#0b1d29"/><circle cx="88" cy="100" r="6" class="cyan"/><text x="60" y="174" text-anchor="middle" class="equip">Webアプリサーバー</text><text x="60" y="196" text-anchor="middle" class="root">WA_Root</text></g>
    <g transform="translate(415 335)"><rect width="120" height="130" rx="8" class="server"/><path d="M26 66 H94 M60 32 V100" stroke="#64eaf4" stroke-width="8" stroke-linecap="round"/><text x="60" y="174" text-anchor="middle" class="equip">APIサーバー</text><text x="60" y="196" text-anchor="middle" class="root">API_Root</text></g>
    <g transform="translate(615 335)"><rect width="120" height="130" rx="8" class="server"/><rect x="25" y="26" width="70" height="22" rx="5" fill="#0b1d29"/><rect x="25" y="58" width="70" height="22" rx="5" fill="#0b1d29"/><text x="60" y="174" text-anchor="middle" class="equip">クラウドストレージ</text><text x="60" y="196" text-anchor="middle" class="root">CloudStorage_Root</text></g>

    <g transform="translate(900 330)"><rect width="180" height="76" rx="8" class="device"/><circle cx="40" cy="38" r="16" fill="none" stroke="#ffd35a" stroke-width="6"/><circle cx="90" cy="38" r="16" fill="none" stroke="#64eaf4" stroke-width="6"/><circle cx="140" cy="38" r="16" fill="none" stroke="#8ee87a" stroke-width="6"/><text x="90" y="120" text-anchor="middle" class="equip">CI/CDパイプライン</text><text x="90" y="142" text-anchor="middle" class="root">CICDPipeline_Root</text></g>
    <g transform="translate(1180 318)"><rect width="190" height="88" rx="8" class="device"/><rect x="25" y="-58" width="140" height="52" rx="6" class="screen"/><polyline points="42,-28 70,-38 100,-18 138,-45" fill="none" stroke="#64eaf4" stroke-width="5"/><text x="95" y="120" text-anchor="middle" class="equip">監視ダッシュボード</text><text x="95" y="142" text-anchor="middle" class="root">MonitorDashboard_Root</text></g>
    <g transform="translate(1045 445)"><rect width="170" height="62" rx="8" class="device"/><path d="M85 13 L118 38 L85 57 L52 38 Z" fill="#0b1d29" stroke="#b56aff" stroke-width="4"/><text x="85" y="104" text-anchor="middle" class="equip">コンテナ基盤</text><text x="85" y="126" text-anchor="middle" class="root">ContainerPlatform_Root</text></g>

    <g transform="translate(230 620)"><ellipse cx="75" cy="25" rx="75" ry="22" class="server"/><rect x="0" y="25" width="150" height="95" class="server"/><ellipse cx="75" cy="120" rx="75" ry="22" class="server"/><text x="75" y="170" text-anchor="middle" class="equip">データベース</text><text x="75" y="192" text-anchor="middle" class="root">Database_Root</text></g>
    <g transform="translate(500 635)"><rect width="180" height="86" rx="8" class="device"/><circle cx="44" cy="43" r="20" fill="none" stroke="#64eaf4" stroke-width="6"/><circle cx="90" cy="43" r="20" fill="none" stroke="#ffd35a" stroke-width="6"/><circle cx="136" cy="43" r="20" fill="none" stroke="#b56aff" stroke-width="6"/><text x="90" y="126" text-anchor="middle" class="equip">CDN / キャッシュ</text><text x="90" y="148" text-anchor="middle" class="root">CDNCache_Root</text></g>
    <g transform="translate(655 605)"><rect width="120" height="130" rx="8" class="server"/><path d="M32 68 H88" stroke="#64eaf4" stroke-width="7"/><path d="M60 40 V96" stroke="#64eaf4" stroke-width="7"/><text x="60" y="174" text-anchor="middle" class="equip">メッセージキュー</text><text x="60" y="196" text-anchor="middle" class="root">MessageQueue_Root</text></g>

    <g transform="translate(895 635)"><rect width="160" height="84" rx="8" class="device"/><path d="M50 44 C50 20 110 20 110 44 C110 74 50 74 50 44 Z" fill="#0b1d29" stroke="#ffd35a" stroke-width="5"/><text x="80" y="124" text-anchor="middle" class="equip">認証基盤</text><text x="80" y="146" text-anchor="middle" class="root">AuthPlatform_Root</text></g>
    <g transform="translate(1110 630)"><rect width="170" height="74" rx="8" class="device"/><rect x="30" y="-54" width="110" height="48" rx="6" class="screen"/><rect x="45" y="20" width="80" height="22" rx="4" fill="#0b1d29"/><text x="85" y="116" text-anchor="middle" class="equip">開発者PC</text><text x="85" y="138" text-anchor="middle" class="root">DeveloperPC_Root</text></g>
    <g transform="translate(1320 635)"><rect width="120" height="84" rx="8" class="device"/><circle cx="60" cy="42" r="26" fill="none" stroke="#8ee87a" stroke-width="6"/><path d="M44 42 H76" stroke="#8ee87a" stroke-width="6"/><text x="60" y="124" text-anchor="middle" class="equip">決済 / 外部API</text><text x="60" y="146" text-anchor="middle" class="root">PaymentAPI_Root</text></g>

    <path class="path" d="M680 415 C810 445 900 448 1025 415"/>
    <path class="path" d="M680 675 C810 650 900 650 1025 675"/>
  </g>

  <rect x="90" y="865" width="1420" height="54" rx="10" fill="#0a1d2c" stroke="#4b3a78"/>
  <text x="120" y="898" class="small">Normal: WA / API / Database / CDN / CI/CD / Dashboard　Hard: Auth / CloudStorage / DeveloperPC　Very Hard: Container / MessageQueue / PaymentAPI</text>
</svg>
